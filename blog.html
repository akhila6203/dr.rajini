<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blogs | Dr. Muthineni Rajini</title>
    <link
        rel="icon"
        type="image/jpeg"
        href="assets/images/logo-url.jpg"
    >

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/blog.css">

    <link
