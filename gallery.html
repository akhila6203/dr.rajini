<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gallery | Dr. Muthineni Rajini</title>
    <link
        rel="icon"
        type="image/jpeg"
        href="assets/images/logo-url.jpg"
    >

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/gallery.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>


    <div id="header-placeholder"></div>


    <!-- =====================================================
         BANNER
    ====================================================== -->

    <section class="gallery-page-banner">

        <div class="container gallery-banner-content">

            <div class="gallery-page-breadcrumb">

                <a href="index.html">
                    Home
                </a>

                <i class="fa-solid fa-chevron-right"></i>

                <span>
                    Gallery
                </span>

            </div>


            <h1>
                Gallery
            </h1>


            <p>
                Explore clinical milestones, professional achievements,
                healthcare moments and educational videos from
                Dr. Muthineni Rajini.
            </p>

        </div>

    </section>


    <!-- =====================================================
         GALLERY CONTENT
    ====================================================== -->

    <section class="gallery-page-section">

        <div class="container">


            <div class="gallery-page-heading">

                <span>
                    Excellence &amp; Education
                </span>

                <h2>
                    Milestones &amp;
                    <em>Insights</em>
                </h2>

                <p>
                    Celebrating medical achievements and sharing
                    valuable women's healthcare education.
                </p>

            </div>


            <div
                class="gallery-common-wrapper"
                data-gallery-component
            ></div>


        </div>

    </section>


    <div id="footer-placeholder"></div>


    <script src="js/gallery-data.js"></script>

    <script src="js/gallery-component.js"></script>

    <script src="js/components.js"></script>

    <script src="js/script.js"></script>


</body>

</html>
